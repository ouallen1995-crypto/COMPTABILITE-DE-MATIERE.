<script>
  // Filet de sécurité : si quelque chose échoue avant ou pendant le chargement de l'app
  // (React, Babel, une ressource CDN, ou une erreur JS), on affiche un message visible
  // au lieu de laisser une page blanche silencieuse.
  window.__appErrors = [];
  window.__showFatalError = function(title, detail) {
    var root = document.getElementById('root');
    if (!root) return;
    var box = document.getElementById('fatal-error-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'fatal-error-box';
      box.style.cssText = 'font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:20px 24px;background:#FEF2F0;border:1px solid #E8B4AC;border-radius:12px;color:#5c1f18;direction:ltr;text-align:left;';
      root.innerHTML = '';
      root.appendChild(box);
    }
    var item = document.createElement('div');
    item.style.cssText = 'margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #E8B4AC;';
    item.innerHTML = '<strong>' + title + '</strong><br><span style="font-size:13px;opacity:0.85;white-space:pre-wrap;">' + detail + '</span>';
    box.appendChild(item);
  };
  window.addEventListener('error', function(e) {
    var msg = (e && e.message) || 'Erreur inconnue';
    var src = (e && e.filename) ? (' (' + e.filename + ':' + e.lineno + ')') : '';
    window.__appErrors.push(msg);
    window.__showFatalError("L'application n'a pas pu se charger", msg + src);
  });
  window.addEventListener('unhandledrejection', function(e) {
    var msg = (e && e.reason && (e.reason.message || String(e.reason))) || 'Promesse rejetée sans détail';
    window.__appErrors.push(msg);
    window.__showFatalError("L'application n'a pas pu se charger (erreur asynchrone)", msg);
  });
  // Si après 12 secondes rien ne s'est affiché, c'est probablement une ressource CDN
  // (React, Babel, Tailwind...) qui n'a pas pu se charger (pas d'accès internet, bloqueur...).
  window.setTimeout(function() {
    var root = document.getElementById('root');
    if (root && root.querySelector('#loading-fallback') && window.__appErrors.length === 0) {
      window.__showFatalError(
        "Le chargement prend trop de temps",
        "L'application a besoin d'accéder à internet pour charger React, Babel et les polices (elle n'est pas fonctionnelle hors-ligne). Vérifiez votre connexion, désactivez un éventuel bloqueur de scripts, puis rechargez la page."
      );
    }
  }, 12000);
</script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=Tajawal:wght@400;500;700&display=swap');

  html, body { margin: 0; padding: 0; }

  .reg-root {
    --paper: #EDE7D8;
    --paper-dark: #E2DAC3;
    --paper-card: #F5F1E6;
    --ink: #2A2721;
    --ink-soft: #6b6455;
    --forest: #1F5C4D;
    --forest-dark: #163f36;
    --rust: #A13D2C;
    --rust-dark: #7c2e21;
    --brass: #A67C3D;
    --teal: #2B5E78;
    --teal-dark: #1e4658;
    --line: rgba(42,39,33,0.16);
    font-family: 'Tajawal', sans-serif;
    color: var(--ink);
    background: var(--paper);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 28px 28px;
    min-height: 100vh;
    direction: rtl;
  }
  .reg-display { font-family: 'Cairo', sans-serif; }
  .tabular { font-variant-numeric: tabular-nums; }

  .reg-card {
    background: var(--paper-card);
    border: 1px solid var(--line);
    box-shadow: 2px 3px 0 rgba(42,39,33,0.08);
  }

  .ticket {
    position: relative;
  }

  .perf-edge {
    border-top: 1.5px dashed var(--line);
    height: 1px;
  }

  .tab-btn {
    font-family: 'Cairo', sans-serif;
    transition: all 0.15s ease;
  }
  .tab-btn[data-active="true"] {
    background: var(--ink);
    color: var(--paper-card);
  }
  .tab-btn[data-active="false"]:hover {
    background: var(--paper-dark);
  }

  input, select {
    font-family: 'Tajawal', sans-serif;
    background: var(--paper-card);
    border: 1.5px solid var(--line);
    color: var(--ink);
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--brass);
  }

  .btn-primary {
    font-family: 'Cairo', sans-serif;
    background: var(--forest);
    color: var(--paper-card);
    transition: background 0.15s ease;
  }
  .btn-primary:hover { background: var(--forest-dark); }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

  .btn-rust {
    font-family: 'Cairo', sans-serif;
    background: var(--rust);
    color: var(--paper-card);
    transition: background 0.15s ease;
  }
  .btn-rust:hover { background: var(--rust-dark); }
  .btn-rust:disabled { opacity: 0.45; cursor: not-allowed; }

  .scrollbar-thin::-webkit-scrollbar { width: 6px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; }

  @media (prefers-reduced-motion: reduce) {
    .tab-btn { transition: none; }
  }

  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 2px;
  }

  @media print {
    body * { visibility: hidden; }
    .print-area, .print-area * { visibility: visible; }
    .print-area {
      position: absolute; top: 0; left: 0; right: 0; margin: 0 auto;
      width: 100%; max-width: 720px; box-shadow: none !important; border: none !important;
    }
    .no-print { display: none !important; }
  }

  @page {
    size: A4;
    margin: 14mm 12mm;
  }

  #loading-fallback {
    display: flex; align-items: center; justify-content: center; height: 100vh;
    font-family: 'Cairo', sans-serif; color: #6b6455; background: #EDE7D8;
  }
</style>

const FONT_STYLES = `
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=Tajawal:wght@400;500;700&display=swap');

  .reg-root {
    --paper: #EDE7D8;
    --paper-dark: #E2DAC3;
    --paper-card: #F5F1E6;
    --ink: #2A2721;
    --ink-soft: #6b6455;
    --forest: #1F5C4D;
    --forest-dark: #163f36;
    --rust: #A13D2C;
    --rust-dark: #7c2e21;
    --brass: #A67C3D;
    --teal: #2B5E78;
    --teal-dark: #1e4658;
    --line: rgba(42,39,33,0.16);
    font-family: 'Tajawal', sans-serif;
    color: var(--ink);
    background: var(--paper);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 28px 28px;
    min-height: 100vh;
    direction: ltr;
  }
  .reg-display { font-family: 'Cairo', sans-serif; }
  .tabular { font-variant-numeric: tabular-nums; }

  .reg-card {
    background: var(--paper-card);
    border: 1px solid var(--line);
    box-shadow: 2px 3px 0 rgba(42,39,33,0.08);
  }

  .ticket {
    position: relative;
  }

  .perf-edge {
    border-top: 1.5px dashed var(--line);
    height: 1px;
  }

  .tab-btn {
    font-family: 'Cairo', sans-serif;
    transition: all 0.15s ease;
  }
  .tab-btn[data-active="true"] {
    background: var(--ink);
    color: var(--paper-card);
  }
  .tab-btn[data-active="false"]:hover {
    background: var(--paper-dark);
  }

  input, select {
    font-family: 'Tajawal', sans-serif;
    background: var(--paper-card);
    border: 1.5px solid var(--line);
    color: var(--ink);
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--brass);
  }

  .btn-primary {
    font-family: 'Cairo', sans-serif;
    background: var(--forest);
    color: var(--paper-card);
    transition: background 0.15s ease;
  }
  .btn-primary:hover { background: var(--forest-dark); }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

  .btn-rust {
    font-family: 'Cairo', sans-serif;
    background: var(--rust);
    color: var(--paper-card);
    transition: background 0.15s ease;
  }
  .btn-rust:hover { background: var(--rust-dark); }
  .btn-rust:disabled { opacity: 0.45; cursor: not-allowed; }

  .scrollbar-thin::-webkit-scrollbar { width: 6px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; }

  @media (prefers-reduced-motion: reduce) {
    .tab-btn { transition: none; }
  }

  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 2px;
  }

  @page {
    size: A4;
    margin: 14mm 12mm;
    @bottom-center { content: "Page " counter(page) " sur " counter(pages); font-size: 9px; }
  }
  @media print {
    body * { visibility: hidden; }
    .print-area, .print-area * { visibility: visible; }
    .print-area {
      position: absolute; top: 0; left: 0; right: 0; margin: 0 auto;
      width: 100%; max-width: 720px; box-shadow: none !important; border: none !important;
    }
    .no-print { display: none !important; }
  }
`;

// Solution de secours : si window.storage (fourni par l'aperçu Claude.ai) n'existe pas,
// on installe un équivalent basé sur localStorage pour que l'app fonctionne aussi comme
// fichier HTML autonome, ouvert directement dans un navigateur normal.
if (typeof window !== 'undefined' && !window.storage) {
  const LS_PREFIX = 'comptabilite-matiere::';
  window.storage = {
    async get(key, shared) {
      const raw = window.localStorage.getItem(LS_PREFIX + key);
      if (raw === null) throw new Error('Key not found: ' + key);
      return { key, value: raw, shared: !!shared };
    },
    async set(key, value, shared) {
      window.localStorage.setItem(LS_PREFIX + key, value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared) {
      const existed = window.localStorage.getItem(LS_PREFIX + key) !== null;
      window.localStorage.removeItem(LS_PREFIX + key);
      return { key, deleted: existed, shared: !!shared };
    },
    async list(prefix, shared) {
      const keys = [];
      for (let i = 0; i < window.localStorage.length; i++) {
        const k = window.localStorage.key(i);
        if (k && k.indexOf(LS_PREFIX) === 0) {
          const stripped = k.slice(LS_PREFIX.length);
          if (!prefix || stripped.indexOf(prefix) === 0) keys.push(stripped);
        }
      }
      return { keys, prefix, shared: !!shared };
    }
  };
}

  for (const cat of ROLE_CATEGORIES) {
    if (ROLE_GROUPS[cat].includes(role)) return cat;
  }
  return null;
}
const CATEGORIES = ["Fournitures de bureau", "Matériel didactique", "Produits de nettoyage et Droguerie"];
const DEFAULT_MIN_STOCK = 2;
function categoryColor(cat) {
  if (cat === 'Matériel didactique') return 'var(--brass)';
  if (cat === "Produits de nettoyage et Droguerie") return 'var(--rust)';
  return 'var(--forest)';
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function todayISO() {
  return new Date().toISOString().slice(0, 10);
}
function fmtDate(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleDateString('fr-FR', { year: 'numeric', month: 'short', day: 'numeric' });
  } catch { return iso; }
}
const FRENCH_MONTHS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
function monthRef(iso) {
  const d = new Date(iso);
  return `${FRENCH_MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
function monthKey(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}

const REGIONS_MA = [
  "Tanger-Tétouan-Al Hoceïma",
  "L'Oriental",
  "Fès-Meknès",
  "Rabat-Salé-Kénitra",
  "Béni Mellal-Khénifra",
  "Casablanca-Settat",
  "Marrakech-Safi",
  "Drâa-Tafilalet",
  "Souss-Massa",
  "Guelmim-Oued Noun",
  "Laâyoune-Sakia El Hamra",
  "Dakhla-Oued Ed-Dahab"
];

function buildLetterheadLines(profile) {
  if (!profile) return ["Royaume du Maroc"];
  return [
    "Royaume du Maroc",
    "Ministère de l'Éducation Nationale, du Préscolaire et des Sports",
    `Académie Régionale de l'Éducation et de la Formation - Région ${profile.region || ''}`,
    `Direction Provinciale de ${profile.directorate || ''}`,
    profile.commune ? `${profile.name || ''} - ${profile.commune}` : (profile.name || '')
  ];
}

function buildSheetWithHeader(columns, rows, letterheadLines) {
  const lines = letterheadLines || ["Royaume du Maroc"];
  const aoa = [...lines.map(l => [l]), [], columns];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  XLSX.utils.sheet_add_json(ws, rows, { header: columns, skipHeader: true, origin: aoa.length });
  const numCols = Math.max(columns.length, 1);
  ws['!merges'] = lines.map((_, r) => ({ s: { r, c: 0 }, e: { r, c: numCols - 1 } }));
  ws['!cols'] = columns.map(() => ({ wch: 26 }));
  ws['!margins'] = { left: 0.4, right: 0.4, top: 0.6, bottom: 0.6, header: 0.2, footer: 0.2 };
  ws['!pageSetup'] = { orientation: numCols > 4 ? 'landscape' : 'portrait', fitToWidth: 1, fitToHeight: 0 };
  return ws;
}

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error('Erreur applicative capturée :', error, info);
  }
  render() {
    if (this.state.error) {
      return (
        <div style={{ fontFamily: 'system-ui, sans-serif', maxWidth: 640, margin: '40px auto', padding: '20px 24px', background: '#FEF2F0', border: '1px solid #E8B4AC', borderRadius: 12, color: '#5c1f18', direction: 'ltr', textAlign: 'left' }}>
          <strong>Une erreur est survenue dans l'application</strong>
          <div style={{ fontSize: 13, opacity: 0.85, whiteSpace: 'pre-wrap', marginTop: 8 }}>
            {String((this.state.error && this.state.error.message) || this.state.error)}
          </div>
          <button
            style={{ marginTop: 14, padding: '8px 16px', borderRadius: 8, background: '#5c1f18', color: 'white', border: 'none', fontWeight: 'bold', cursor: 'pointer' }}
            onClick={() => window.location.reload()}
          >
            Recharger la page
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

function InventoryRegister({ storageKey, dirKey, profile, onOpenMenu, lang }) {
  const [items, setItems] = useState([]);
  const [movements, setMovements] = useState([]);
  const [deliverySeq, setDeliverySeq] = useState(0);
  const [pvLog, setPvLog] = useState([]);
  const [statementCounts, setStatementCounts] = useState({});
  const [loaded, setLoaded] = useState(false);
  const [activeTab, setActiveTab] = useState('stock');
  const [tabMenuOpen, setTabMenuOpen] = useState(false);
  const [toast, setToast] = useState(null);
  const saveTimer = useRef(null);

  useEffect(() => {
    setLoaded(false);
    (async () => {
      try {
        const res = await window.storage.get(storageKey, false);
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          setItems(parsed.items || []);
          setMovements(parsed.movements || []);
          setDeliverySeq(parsed.deliverySeq || 0);
          setPvLog(parsed.pvLog || []);
          setStatementCounts(parsed.statementCounts || {});
        } else {
          setItems([]); setMovements([]); setDeliverySeq(0); setPvLog([]); setStatementCounts({});
        }
      } catch (e) {
        // no existing data yet
      } finally {
        setLoaded(true);
      }
    })();
  }, [storageKey]);

  useEffect(() => {
    if (!loaded) return;
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        await window.storage.set(storageKey, JSON.stringify({ items, movements, deliverySeq, pvLog, statementCounts }), false);
      } catch (e) {
        console.error('Échec de l\'enregistrement', e);
      }
    }, 250);
  }, [items, movements, deliverySeq, pvLog, loaded]);

  function showToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(null), 2200);
  }

  const stockByItem = useMemo(() => {
    const map = {};
    for (const it of items) map[it.id] = 0;
    for (const m of movements) {
      if (!(m.itemId in map)) map[m.itemId] = 0;
      map[m.itemId] += m.type === 'in' ? m.qty : -m.qty;
    }
    return map;
  }, [items, movements]);

  function addItem(name, unit, category, minStock) {
    const clean = name.trim();
    if (!clean) return;
    if (items.some(i => i.name === clean)) { showToast('Cet article existe déjà'); return; }
    setItems(prev => [...prev, {
      id: uid(), name: clean, unit,
      category: category || CATEGORIES[0],
      minStock: Number.isFinite(minStock) ? minStock : DEFAULT_MIN_STOCK
    }]);
    showToast('Article ajouté');
  }

  function updateItem(id, updates) {
    setItems(prev => prev.map(it => it.id === id ? { ...it, ...updates } : it));
    showToast('Article mis à jour');
  }

  function deleteItem(id) {
    setItems(prev => prev.filter(i => i.id !== id));
    setMovements(prev => prev.filter(m => m.itemId !== id));
  }

  function addInMovement(itemId, qty, source, invoiceNo, note, date) {
    setMovements(prev => [...prev, {
      id: uid(), itemId, type: 'in', qty, person: '', role: '', source: source || '', invoiceNo: invoiceNo || '', note, date: date || todayISO(), batchId: uid()
    }]);
    showToast('Entrée enregistrée au stock');
  }

  function addOutBatch(lines, note, date) {
    const batchId = uid();
    const finalDate = date || todayISO();
    const seq = deliverySeq + 1;
    const refNo = `${String(seq).padStart(4, '0')}/${new Date().getFullYear()}`;
    const newMoves = lines.map(l => ({
      id: uid(), itemId: l.itemId, type: 'out', qty: l.qty,
      person: l.person, matricule: l.matricule || '', role: l.role || '',
      note, date: finalDate, batchId, refNo
    }));
    setMovements(prev => [...prev, ...newMoves]);
    setDeliverySeq(seq);
    showToast('Livraison enregistrée et décharge émise');
    return { batchId, refNo };
  }

  function issuePV(ref, date) {
    setPvLog(prev => (prev.some(p => p.ref === ref) ? prev : [...prev, { ref, date }]));
  }

  function issueStatement(key) {
    const nextCount = (statementCounts[key] || 0) + 1;
    setStatementCounts(prev => ({ ...prev, [key]: nextCount }));
    return nextCount;
  }

  const outBatches = useMemo(() => {
    const map = {};
    for (const m of movements) {
      if (m.type !== 'out') continue;
      if (!map[m.batchId]) map[m.batchId] = { batchId: m.batchId, refNo: m.refNo, date: m.date, note: m.note, lines: [] };
      map[m.batchId].lines.push(m);
    }
    return Object.values(map).sort((a, b) => (a.date < b.date ? 1 : -1));
  }, [movements]);

  const byPerson = useMemo(() => {
    const map = {};
    for (const m of movements) {
      if (m.type !== 'out') continue;
      const key = m.person || 'Sans nom';
      if (!map[key]) map[key] = { person: key, role: m.role, matricule: m.matricule, batches: {} };
      if (!map[key].batches[m.batchId]) map[key].batches[m.batchId] = { batchId: m.batchId, date: m.date, note: m.note, lines: [] };
      map[key].batches[m.batchId].lines.push(m);
    }
    return Object.values(map)
      .map(p => ({ ...p, batches: Object.values(p.batches) }))
      .sort((a, b) => a.person.localeCompare(b.person, 'ar'));
  }, [movements]);

  async function exportBackup() {
    try {
      const main = await window.storage.get(storageKey, false);
      const dir = await window.storage.get(dirKey, false);
      const backup = {
        app: 'Comptabilité de matière', version: 1, exportedAt: new Date().toISOString(),
        profile,
        main: main ? JSON.parse(main.value) : null,
        directory: dir ? JSON.parse(dir.value) : null
      };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `sauvegarde-${(profile && profile.name) || 'etablissement'}-${todayISO()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Sauvegarde téléchargée');
    } catch (e) {
      alert('Impossible de créer la sauvegarde.');
    }
  }

  async function importBackup(file) {
    if (!confirm("La restauration d'une sauvegarde remplacera toutes les données actuelles de cet établissement sur cet appareil. Confirmer ?")) return;
    try {
      const text = await file.text();
      const backup = JSON.parse(text);
      if (backup.main) await window.storage.set(storageKey, JSON.stringify(backup.main), false);
      if (backup.directory) await window.storage.set(dirKey, JSON.stringify(backup.directory), false);
      alert("Restauration réussie. L'application va se recharger.");
      window.location.reload();
    } catch (e) {
      alert("Impossible de lire le fichier de sauvegarde. Vérifiez qu'il s'agit d'un fichier valide.");
    }
  }

  function exportToExcel() {
    const itemName = id => items.find(i => i.id === id)?.name || '—';
    const itemUnit = id => items.find(i => i.id === id)?.unit || '';

    const movementRows = [...movements]
      .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0))
      .map(m => ({
        'N° facture/décharge': m.type === 'out' ? (m.refNo || '') : (m.invoiceNo || ''),
        'Date': m.date,
        'Type': m.type === 'in' ? 'Entrée' : 'Sortie',
        'Article': itemName(m.itemId),
        'Unité': itemUnit(m.itemId),
        'Quantité': m.qty,
        'Bénéficiaire': m.type === 'out' ? m.person : '',
        'Matricule / N° CIN': m.type === 'out' ? (m.matricule || '') : '',
        'Cadre/Fonction': m.type === 'out' ? m.role : '',
        'Partie donatrice': m.type === 'in' ? (m.source || '') : '',
        'Remarque': m.note || ''
      }));

    const stockRows = items.map(it => ({
      "Article": it.name,
      "Catégorie": it.category || CATEGORIES[0],
      "Unité": it.unit,
      "Solde actuel": stockByItem[it.id] || 0,
      "Seuil d'alerte": it.minStock ?? DEFAULT_MIN_STOCK
    }));

    const personRows = [];
    byPerson.forEach(p => {
      p.batches.forEach(b => {
        b.lines.forEach(l => {
          personRows.push({
            'Nom': p.person,
            'Matricule / N° CIN': l.matricule || '',
            'Cadre/Fonction': l.role,
            'Date': b.date,
            'Article': itemName(l.itemId),
            'Quantité': l.qty,
            'Remarque': b.note || ''
          });
        });
      });
    });

    const wb = XLSX.utils.book_new();
    const pvRows = pvLog.map(p => ({ "N° PV": p.ref, "Date d'émission": p.date }));
    const letterhead = buildLetterheadLines(profile);

    XLSX.utils.book_append_sheet(wb, buildSheetWithHeader(["Article", "Catégorie", "Unité", "Solde actuel", "Seuil d'alerte"], stockRows, letterhead), 'Stock actuel');
    XLSX.utils.book_append_sheet(wb, buildSheetWithHeader(['Nom', 'Matricule / N° CIN', 'Cadre/Fonction', 'Date', 'Article', 'Quantité', 'Remarque'], personRows, letterhead), 'Par bénéficiaire');
    XLSX.utils.book_append_sheet(wb, buildSheetWithHeader(['N° facture/décharge', 'Date', 'Type', 'Article', 'Unité', 'Quantité', 'Bénéficiaire', 'Matricule / N° CIN', 'Cadre/Fonction', 'Partie donatrice', 'Remarque'], movementRows, letterhead), 'Registre complet');
    if (pvRows.length > 0) XLSX.utils.book_append_sheet(wb, buildSheetWithHeader(["N° PV", "Date d'émission"], pvRows, letterhead), "PV d'inventaire");
    XLSX.writeFile(wb, `comptabilite-matiere-${(profile && profile.name) || ''}-${todayISO()}.xlsx`);
  }

  function downloadDirectoryTemplate() {
    const columns = ['Nom complet', 'Matricule ou N° CIN', 'Cadre/Fonction'];
    const wb = XLSX.utils.book_new();
    const letterhead = buildLetterheadLines(profile);
    XLSX.utils.book_append_sheet(wb, buildSheetWithHeader(columns, [], letterhead), 'Administration');
    XLSX.utils.book_append_sheet(wb, buildSheetWithHeader(columns, [], letterhead), 'Corps enseignant');
    XLSX.utils.book_append_sheet(wb, buildSheetWithHeader(columns, [], letterhead), 'Agents');
    XLSX.writeFile(wb, `modele-repertoire-personnes.xlsx`);
  }

  if (!loaded) {
    return (
      <div className="reg-root flex items-center justify-center" style={{ height: '100vh' }}>
        <style>{FONT_STYLES}</style>
        <div className="reg-display text-lg" style={{ color: 'var(--ink-soft)' }}>...Chargement du registre...</div>
      </div>
    );
  }

  return (
    <div className="reg-root" dir={lang === 'ar' ? 'rtl' : 'ltr'}>
      <style>{FONT_STYLES}</style>

      {/* Header */}
      <header className="border-b" style={{ borderColor: 'var(--line)', background: 'var(--paper-card)' }}>
        <div className="max-w-5xl mx-auto px-5 py-5 flex items-center justify-between gap-4">
          <div className="flex items-center gap-3">
            <button
              className="p-2 rounded-lg shrink-0"
              style={{ background: 'var(--paper-dark)' }}
              onClick={onOpenMenu}
              aria-label="Menu"
            >
              <MenuIcon size={20} />
            </button>
            <img src={LOGO_SRC} alt="Emblème du Royaume du Maroc" style={{ width: 40, height: 44, objectFit: 'contain' }} className="shrink-0" />
            <div>
              <h1 className="reg-display text-xl font-black leading-tight">{t(lang, 'appTitle')}</h1>
              <p className="text-xs mt-0.5" style={{ color: 'var(--ink-soft)' }}>{(profile && profile.name) || 'Suivi des entrées, sorties et livraisons'}</p>
            </div>
          </div>
          <div className="flex items-center gap-2 flex-wrap justify-end">
            <StatPill items={items} movements={movements} stockByItem={stockByItem} />
            <button
              className="btn-primary flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-bold shrink-0 disabled:opacity-40"
              onClick={exportToExcel}
              disabled={items.length === 0 && movements.length === 0}
            >
              <Download size={14} /> Exporter Excel
            </button>
            <button
              className="flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-bold shrink-0"
              style={{ background: 'var(--paper-dark)' }}
              onClick={exportBackup}
              title="Télécharger une sauvegarde complète"
            >
              <Download size={14} /> Sauvegarde
            </button>
            <label
              className="flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-bold shrink-0 cursor-pointer"
              style={{ background: 'var(--paper-dark)' }}
              title="Restaurer Sauvegarde"
            >
              <Upload size={14} /> Restaurer
              <input
                type="file" accept=".json" className="hidden"
                onChange={e => { const f = e.target.files[0]; if (f) importBackup(f); e.target.value = ''; }}
              />
            </label>
          </div>
        </div>

        {/* Tabs */}
        <nav className="max-w-5xl mx-auto px-5 pb-3 relative">
          {(() => {
            const TABS = [
              { key: 'stock', icon: Package, label: t(lang, 'tabStock') },
              { key: 'deliver', icon: ArrowUpFromLine, label: t(lang, 'tabDeliver') },
              { key: 'people', icon: Users, label: t(lang, 'tabPeople') },
              { key: 'log', icon: ScrollText, label: t(lang, 'tabLog') },
              { key: 'pv', icon: ClipboardList, label: t(lang, 'tabPV') },
            ];
            const current = TABS.find(tb => tb.key === activeTab) || TABS[0];
            const CurrentIcon = current.icon;
            return (
              <>
                <button
                  className="reg-card flex items-center justify-between gap-2 px-4 py-2.5 rounded-lg text-sm font-bold w-full sm:w-auto sm:min-w-[240px]"
                  onClick={() => setTabMenuOpen(v => !v)}
                >
                  <span className="flex items-center gap-2">
                    <CurrentIcon size={16} />
                    {current.label}
                  </span>
                  <ChevronDown size={16} style={{ transform: tabMenuOpen ? 'rotate(180deg)' : 'none', transition: 'transform 0.15s' }} />
                </button>
                {tabMenuOpen && (
                  <>
                    <div className="fixed inset-0 z-10" onClick={() => setTabMenuOpen(false)} />
                    <div className="reg-card rounded-lg mt-1 absolute z-20 w-full sm:w-[240px] overflow-hidden">
                      {TABS.map(tb => {
                        const TabIcon = tb.icon;
                        return (
                          <button
                            key={tb.key}
                            className="flex items-center gap-2 w-full text-sm py-2.5 px-4"
                            style={{ background: activeTab === tb.key ? 'var(--paper-dark)' : 'transparent', color: activeTab === tb.key ? 'var(--forest)' : 'var(--ink)', fontWeight: activeTab === tb.key ? 'bold' : 'normal' }}
                            onClick={() => { setActiveTab(tb.key); setTabMenuOpen(false); }}
                          >
                            <TabIcon size={16} />
                            {tb.label}
                          </button>
                        );
                      })}
                    </div>
                  </>
                )}
              </>
            );
          })()}
        </nav>
      </header>

      <main className="max-w-5xl mx-auto px-5 py-6">
        {activeTab === 'stock' && (
          <StockTab items={items} stockByItem={stockByItem} movements={movements} onAddItem={addItem} onAddIn={addInMovement} onDeleteItem={deleteItem} onUpdateItem={updateItem} lang={lang} />
        )}
        {activeTab === 'deliver' && (
          <DeliverTab items={items} stockByItem={stockByItem} onSubmit={addOutBatch} onDownloadTemplate={downloadDirectoryTemplate} profile={profile} dirKey={dirKey} lang={lang} />
        )}
        {activeTab === 'people' && (
          <PeopleTab byPerson={byPerson} items={items} onIssueStatement={issueStatement} profile={profile} lang={lang} />
        )}
        {activeTab === 'log' && (
          <LogTab movements={movements} items={items} pvLog={pvLog} stockByItem={stockByItem} lang={lang} />
        )}
        {activeTab === 'pv' && (
          <PVTab items={items} stockByItem={stockByItem} pvLog={pvLog} onIssue={issuePV} profile={profile} lang={lang} />
        )}
      </main>

      {toast && (
        <div
          className="fixed bottom-6 left-1/2 -translate-x-1/2 reg-display text-sm px-5 py-2.5 rounded-full shadow-lg"
          style={{ background: 'var(--ink)', color: 'var(--paper-card)' }}
        >
          {toast}
        </div>
      )}
    </div>
  );
}

function StatPill({ items, movements, stockByItem }) {
  const totalStock = items.reduce((s, it) => s + (stockByItem[it.id] || 0), 0);
  const lowCount = items.filter(it => (stockByItem[it.id] || 0) <= (it.minStock ?? DEFAULT_MIN_STOCK)).length;
  return (
    <div className="hidden sm:flex items-center gap-4 text-xs reg-display">
      <div className="text-center">
        <div className="tabular text-lg font-black" style={{ color: 'var(--forest)' }}>{items.length}</div>
        <div style={{ color: 'var(--ink-soft)' }}>article(s)</div>
      </div>
      <div className="w-px h-8" style={{ background: 'var(--line)' }} />
      <div className="text-center">
        <div className="tabular text-lg font-black">{totalStock}</div>
        <div style={{ color: 'var(--ink-soft)' }}>Quantité totale</div>
      </div>
      {lowCount > 0 && (
        <>
          <div className="w-px h-8" style={{ background: 'var(--line)' }} />
          <div className="text-center">
            <div className="tabular text-lg font-black" style={{ color: 'var(--rust)' }}>{lowCount}</div>
            <div style={{ color: 'var(--ink-soft)' }}>Stock faible</div>
          </div>
        </>
      )}
    </div>
  );
}

function MenuIcon({ size = 20 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <line x1="3" y1="6" x2="21" y2="6" />
      <line x1="3" y1="12" x2="21" y2="12" />
      <line x1="3" y1="18" x2="21" y2="18" />
    </svg>
  );
}

function TabButton({ icon: Icon, label, active, onClick }) {
  return (
    <button
      className="tab-btn flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-bold whitespace-nowrap"
      data-active={active}
      onClick={onClick}
    >
      <Icon size={16} />
      {label}
    </button>
  );
}

/* ---------------- Stock Tab ---------------- */
function StockTab({ items, stockByItem, movements, onAddItem, onAddIn, onDeleteItem, onUpdateItem, lang }) {
  const [showAdd, setShowAdd] = useState(false);
  const [name, setName] = useState('');
  const [unit, setUnit] = useState(UNITS[0]);
  const [category, setCategory] = useState(CATEGORIES[0]);
  const [minStock, setMinStock] = useState(String(DEFAULT_MIN_STOCK));
  const [inFor, setInFor] = useState(null); // item id for "in" form
  const [inQty, setInQty] = useState('');
  const [inSource, setInSource] = useState('');
  const [inInvoice, setInInvoice] = useState('');
  const [inNote, setInNote] = useState('');
  const [inDate, setInDate] = useState(todayISO());
  const sourceHistory = useMemo(() => {
    return Array.from(new Set(movements.filter(m => m.type === 'in' && m.source).map(m => m.source)));
  }, [movements]);
  const [query, setQuery] = useState('');
  const [catFilter, setCatFilter] = useState('all');
  const [editFor, setEditFor] = useState(null); // item id for edit form
  const [editName, setEditName] = useState('');
  const [editUnit, setEditUnit] = useState('');
  const [editCategory, setEditCategory] = useState('');
  const [editMinStock, setEditMinStock] = useState('');
  const [collapsedCats, setCollapsedCats] = useState(() => new Set());

  function toggleCollapse(cat) {
    setCollapsedCats(prev => {
      const next = new Set(prev);
      if (next.has(cat)) next.delete(cat); else next.add(cat);
      return next;
    });
  }

  const filtered = items
    .filter(i => i.name.includes(query.trim()))
    .filter(i => catFilter === 'all' || i.category === catFilter);
  const stockFlatPagination = usePagination(filtered, 12);

  function openEdit(it) {
    setEditFor(it.id);
    setEditName(it.name);
    setEditUnit(it.unit);
    setEditCategory(it.category || CATEGORIES[0]);
    setEditMinStock(String(it.minStock ?? DEFAULT_MIN_STOCK));
  }

  function saveEdit(id) {
    onUpdateItem(id, {
      name: editName.trim(), unit: editUnit, category: editCategory,
      minStock: Number(editMinStock) || DEFAULT_MIN_STOCK
    });
    setEditFor(null);
  }

  function renderItemCard(it) {
    const stock = stockByItem[it.id] || 0;
    const threshold = it.minStock ?? DEFAULT_MIN_STOCK;
    const low = stock <= threshold;
    const isEditing = editFor === it.id;
    return (
              <div key={it.id} className="reg-card rounded-xl p-4 relative">
                <div className="absolute top-3 left-3 flex items-center gap-2">
                  <button className="opacity-40 hover:opacity-100" onClick={() => isEditing ? setEditFor(null) : openEdit(it)} aria-label="Modifier l'article">
                    <Pencil size={14} />
                  </button>
                  <button
                    className="opacity-40 hover:opacity-100"
                    onClick={() => { if (confirm(`Supprimer "${it.name}" ainsi que tous les mouvements associés ?`)) onDeleteItem(it.id); }}
                    aria-label="Supprimer l'article"
                  >
                    <Trash2 size={15} />
                  </button>
                </div>

                {isEditing ? (
                  <div className="flex flex-col gap-2 pl-12">
                    <input className="px-2 py-1.5 rounded-lg text-sm" value={editName} onChange={e => setEditName(e.target.value)} />
                    <div className="grid grid-cols-2 gap-2">
                      <select className="px-2 py-1.5 rounded-lg text-sm" value={editCategory} onChange={e => setEditCategory(e.target.value)}>
                        {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                      <select className="px-2 py-1.5 rounded-lg text-sm" value={editUnit} onChange={e => setEditUnit(e.target.value)}>
                        {UNITS.map(u => <option key={u} value={u}>{u}</option>)}
                      </select>
                    </div>
                    <div className="flex items-center gap-2">
                      <label className="text-xs shrink-0" style={{ color: 'var(--ink-soft)' }}>{t(lang, 'fieldAlertThreshold')}</label>
                      <input className="flex-1 px-2 py-1.5 rounded-lg text-sm tabular" type="number" min="0" value={editMinStock} onChange={e => setEditMinStock(e.target.value)} />
                    </div>
                    <button className="btn-primary py-1.5 rounded-lg text-xs font-bold flex items-center justify-center gap-1" onClick={() => saveEdit(it.id)}>
                      <Check size={13} /> {t(lang, 'save')}
                    </button>
                  </div>
                ) : (
                  <>
                    <div className="reg-display font-bold text-sm pl-12">{it.name}</div>
                    <div className="flex items-center gap-2 mt-0.5">
                      <span
                        className="text-[10px] font-bold px-1.5 py-0.5 rounded-full"
                        style={{ background: 'var(--paper-dark)', color: categoryColor(it.category) }}
                      >
                        {it.category || CATEGORIES[0]}
                      </span>
                      <span className="text-xs" style={{ color: 'var(--ink-soft)' }}>{it.unit}</span>
                    </div>
                    <div className="flex items-end justify-between mt-3">
                      <div>
                        <div className="tabular reg-display text-2xl font-black" style={{ color: low ? 'var(--rust)' : 'var(--forest)' }}>
                          {stock}
                        </div>
                        {low && <div className="text-[11px] font-bold" style={{ color: 'var(--rust)' }}>{t(lang, 'lowStock')} (≤ {threshold})</div>}
                      </div>
                      <button
                        className="text-xs font-bold flex items-center gap-1 px-3 py-1.5 rounded-lg"
                        style={{ background: 'var(--paper-dark)' }}
                        onClick={() => { setInFor(it.id); setInQty(''); setInSource(''); setInInvoice(''); setInNote(''); setInDate(todayISO()); }}
                      >
                        <ArrowDownToLine size={14} /> {t(lang, 'recordEntry')}
                      </button>
                    </div>

                    {inFor === it.id && (
                      <div className="mt-3 pt-3 border-t flex flex-col gap-2" style={{ borderColor: 'var(--line)' }}>
                        <input
                          className="px-3 py-2 rounded-lg text-sm tabular"
                          type="date" value={inDate} onChange={e => setInDate(e.target.value)}
                        />
                        <input
                          className="px-3 py-2 rounded-lg text-sm tabular"
                          type="number" min="1" placeholder={t(lang, 'qtyIn')}
                          value={inQty} onChange={e => setInQty(e.target.value)}
                          autoFocus
                        />
                        <input
                          className="px-3 py-2 rounded-lg text-sm"
                          placeholder={t(lang, 'fieldSource')}
                          list="source-history" value={inSource} onChange={e => setInSource(e.target.value)}
                        />
                        <datalist id="source-history">
                          {sourceHistory.map((s, i) => <option key={i} value={s} />)}
                        </datalist>
                        <input
                          className="px-3 py-2 rounded-lg text-sm"
                          placeholder={t(lang, 'fieldInvoiceNo')}
                          value={inInvoice} onChange={e => setInInvoice(e.target.value)}
                        />
                        <input
                          className="px-3 py-2 rounded-lg text-sm"
                          placeholder={t(lang, 'fieldNote')}
                          value={inNote} onChange={e => setInNote(e.target.value)}
                        />
                        <div className="flex gap-2">
                          <button
                            className="btn-primary flex-1 py-2 rounded-lg text-sm font-bold"
                            disabled={!inQty || Number(inQty) <= 0}
                            onClick={() => { onAddIn(it.id, Number(inQty), inSource, inInvoice, inNote, inDate); setInFor(null); }}
                          >
                            {t(lang, 'confirmEntry')}
                          </button>
                          <button className="px-3 py-2 rounded-lg text-sm" style={{ background: 'var(--paper-dark)' }} onClick={() => setInFor(null)}>
                            {t(lang, 'cancelBtn')}
                          </button>
                        </div>
                      </div>
                    )}
                  </>
                )}
              </div>
            );
  }

  return (
    <div>
      <div className="flex items-center gap-3 mb-3">
        <div className="relative flex-1">
          <Search size={16} className="absolute top-1/2 -translate-y-1/2 right-3" style={{ color: 'var(--ink-soft)' }} />
          <input
            className="w-full pr-9 pl-3 py-2.5 rounded-lg text-sm"
            placeholder={t(lang, 'searchItem')}
            value={query}
            onChange={e => setQuery(e.target.value)}
          />
        </div>
        <button className="btn-primary flex items-center gap-1.5 px-4 py-2.5 rounded-lg text-sm font-bold shrink-0" onClick={() => setShowAdd(v => !v)}>
          <Plus size={16} /> {t(lang, 'addItem')}
        </button>
      </div>

      <CategoryFilterDropdown value={catFilter} onChange={setCatFilter} lang={lang} />

      {showAdd && (
        <div className="reg-card rounded-xl p-4 mb-5 flex flex-wrap items-end gap-3">
          <div className="flex-1 min-w-[160px]">
            <label className="text-xs font-bold block mb-1" style={{ color: 'var(--ink-soft)' }}>{t(lang, 'fieldItemName')}</label>
            <input className="w-full px-3 py-2 rounded-lg text-sm" placeholder="Ex : Stylos à bille bleus" value={name} onChange={e => setName(e.target.value)} />
          </div>
          <div className="min-w-[120px]">
            <label className="text-xs font-bold block mb-1" style={{ color: 'var(--ink-soft)' }}>{t(lang, 'fieldCategory')}</label>
            <select className="w-full px-3 py-2 rounded-lg text-sm" value={category} onChange={e => setCategory(e.target.value)}>
              {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div className="min-w-[110px]">
            <label className="text-xs font-bold block mb-1" style={{ color: 'var(--ink-soft)' }}>{t(lang, 'fieldUnit')}</label>
            <select className="w-full px-3 py-2 rounded-lg text-sm" value={unit} onChange={e => setUnit(e.target.value)}>
              {UNITS.map(u => <option key={u} value={u}>{u}</option>)}
            </select>
          </div>
          <div className="min-w-[90px]">
            <label className="text-xs font-bold block mb-1" style={{ color: 'var(--ink-soft)' }}>{t(lang, 'fieldAlertThreshold')}</label>
            <input className="w-full px-3 py-2 rounded-lg text-sm tabular" type="number" min="0" value={minStock} onChange={e => setMinStock(e.target.value)} />
          </div>
          <button
            className="btn-primary px-4 py-2 rounded-lg text-sm font-bold"
            onClick={() => { onAddItem(name, unit, category, Number(minStock) || DEFAULT_MIN_STOCK); setName(''); setMinStock(String(DEFAULT_MIN_STOCK)); setShowAdd(false); }}
            disabled={!name.trim()}
          >
            {t(lang, 'add')}
          </button>
        </div>
      )}

      {items.length === 0 ? (
        <EmptyState icon={Package} text={t(lang, 'emptyStock')} />
      ) : filtered.length === 0 ? (
        <EmptyState icon={Search} text={t(lang, 'emptyResults')} />
      ) : (
        catFilter === 'all' ? (
          <div className="flex flex-col gap-4">
            {(() => {
              const groups = CATEGORIES
                .map(cat => ({ cat, list: filtered.filter(i => (i.category || CATEGORIES[0]) === cat) }))
                .filter(g => g.list.length > 0);
              const uncategorized = filtered.filter(i => !CATEGORIES.includes(i.category));
              if (uncategorized.length > 0) groups.push({ cat: 'Autres', list: uncategorized });
              return groups.map(g => {
                const isCollapsed = collapsedCats.has(g.cat);
                return (
                  <div key={g.cat}>
                    <button
                      className="w-full flex items-center justify-between px-3 py-2 rounded-lg mb-2"
                      style={{ background: 'var(--paper-dark)' }}
                      onClick={() => toggleCollapse(g.cat)}
                    >
                      <span className="reg-display text-sm font-bold flex items-center gap-2" style={{ color: categoryColor(g.cat) }}>
                        {g.cat}
                        <span className="text-xs font-normal tabular" style={{ color: 'var(--ink-soft)' }}>({g.list.length})</span>
                      </span>
                      <ChevronDown size={16} style={{ transform: isCollapsed ? 'none' : 'rotate(180deg)', transition: 'transform 0.15s' }} />
                    </button>
                    {!isCollapsed && (
                      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
                        {g.list.map(it => renderItemCard(it))}
                      </div>
                    )}
                  </div>
                );
              });
            })()}
          </div>
        ) : (
          <>
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
              {stockFlatPagination.pageItems.map(it => renderItemCard(it))}
            </div>
            <Pagination page={stockFlatPagination.page} totalPages={stockFlatPagination.totalPages} onChange={stockFlatPagination.setPage} />
          </>
        )
      )}
    </div>
  );
}

function DeliverTab({ items, stockByItem, onSubmit, onDownloadTemplate, profile, dirKey, lang }) {
  const [mode, setMode] = useState('individual'); // 'individual' | 'collective'
  const [note, setNote] = useState('');
  const [deliveryDate, setDeliveryDate] = useState(todayISO());
  const [lastSlip, setLastSlip] = useState(null);

  // People directory (imported from Excel)
  const [directory, setDirectory] = useState([]);
  const [dirLoaded, setDirLoaded] = useState(false);
  const dirSaveTimer = useRef(null);

  useEffect(() => {
    setDirLoaded(false);
    (async () => {
      try {
        const res = await window.storage.get(dirKey, false);
        if (res && res.value) setDirectory(JSON.parse(res.value));
        else setDirectory([]);
      } catch (e) {
        // no directory yet
      } finally {
        setDirLoaded(true);
      }
    })();
  }, [dirKey]);

  useEffect(() => {
    if (!dirLoaded) return;
    clearTimeout(dirSaveTimer.current);
    dirSaveTimer.current = setTimeout(async () => {
      try { await window.storage.set(dirKey, JSON.stringify(directory), false); } catch (e) { console.error(e); }
    }, 250);
  }, [directory, dirLoaded]);

  function parseOneSheet(sheet) {
    const raw = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
    // find the header row: the first row containing a cell that mentions "Nom"
    const headerRowIdx = raw.findIndex(row => row.some(cell => String(cell).includes('Nom')));
    if (headerRowIdx === -1) return [];
    const headerRow = raw[headerRowIdx].map(h => String(h || ''));
    const nameCol = headerRow.findIndex(h => h.includes('Nom'));
    const matCol = headerRow.findIndex(h => h.includes('Matricule') || h.includes('CIN') || h.includes('Carte'));
    const roleCol = headerRow.findIndex(h => h.includes('Cadre') || h.includes('Fonction'));
    const dataRows = raw.slice(headerRowIdx + 1);
    return dataRows
      .map(row => ({
        name: String((nameCol >= 0 ? row[nameCol] : '') || '').trim(),
        matricule: String((matCol >= 0 ? row[matCol] : '') || '').trim(),
        role: String((roleCol >= 0 ? row[roleCol] : '') || '').trim()
      }))
      .filter(p => p.name);
  }

  function parseDirectorySheet(workbook) {
    const all = [];
    for (const sheetName of workbook.SheetNames) {
      const sheet = workbook.Sheets[sheetName];
      all.push(...parseOneSheet(sheet));
    }
    return all;
  }

  async function handleImportFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const parsed = parseDirectorySheet(wb);
      setDirectory(parsed);
    } catch (err) {
      alert("Impossible de lire le fichier. Vérifiez qu'il s'agit d'un fichier Excel valide.");
    }
    e.target.value = '';
  }

  const roleOptions = useMemo(() => {
    return Array.from(new Set([...ROLES, ...directory.map(p => p.role).filter(Boolean)]));
  }, [directory]);

  function lookupPerson(name) {
    return directory.find(p => p.name === name);
  }

  // Individual mode state
  const [person, setPerson] = useState('');
  const [matricule, setMatricule] = useState('');
  const [roleCategory, setRoleCategory] = useState('');
  const [role, setRole] = useState('');
  const [lines, setLines] = useState([{ category: '', itemId: '', qty: '' }]);

  function onPersonNameChange(val) {
    setPerson(val);
    const found = lookupPerson(val);
    if (found) {
      setMatricule(found.matricule);
      if (found.role) {
        setRole(found.role);
        setRoleCategory(findRoleCategory(found.role) || '');
      }
    }
  }

  function onChangeRoleCategory(cat) {
    setRoleCategory(cat);
    setRole('');
  }

  // Collective mode state
  const emptyRow = () => ({ person: '', matricule: '', roleCategory: '', role: '', itemCategory: '', itemId: '', qty: '' });
  const [rows, setRows] = useState([emptyRow()]);

  // Bulk-assign (e.g. same material to a whole group at once)
  const [showBulk, setShowBulk] = useState(false);
  const [bulkCategory, setBulkCategory] = useState('');
  const [bulkItemId, setBulkItemId] = useState('');
  const [bulkQty, setBulkQty] = useState('');
  const [excluded, setExcluded] = useState(() => new Set());

  function toggleExcluded(name) {
    setExcluded(prev => {
      const next = new Set(prev);
      if (next.has(name)) next.delete(name); else next.add(name);
      return next;
    });
  }

  function deliverToAll() {
    const included = directory.filter(p => !excluded.has(p.name));
    if (included.length === 0 || !bulkItemId || !bulkQty) return;
    const finalLines = included.map(p => ({
      person: p.name, matricule: p.matricule || '', role: p.role || '',
      itemId: bulkItemId, qty: Number(bulkQty)
    }));
    const { batchId, refNo } = onSubmit(finalLines, note, deliveryDate);
    setLastSlip({
      batchId, refNo, note, date: deliveryDate,
      lines: finalLines.map(l => ({ ...items.find(i => i.id === l.itemId), qty: l.qty, person: l.person, matricule: l.matricule, role: l.role }))
    });
    setShowBulk(false);
    setBulkCategory(''); setBulkItemId(''); setBulkQty(''); setExcluded(new Set());
  }

  function updateLine(idx, field, val) {
    setLines(prev => prev.map((l, i) => i === idx ? { ...l, [field]: val } : l));
  }
  function addLine() { setLines(prev => [...prev, { category: '', itemId: '', qty: '' }]); }
  function removeLine(idx) { setLines(prev => prev.filter((_, i) => i !== idx)); }

  function updateRow(idx, field, val) {
    setRows(prev => prev.map((r, i) => i === idx ? { ...r, [field]: val } : r));
  }
  function addRow() { setRows(prev => [...prev, emptyRow()]); }
  function removeRow(idx) { setRows(prev => prev.filter((_, i) => i !== idx)); }

  const validLines = lines.filter(l => l.itemId && Number(l.qty) > 0);
  const overStockIndividual = validLines.some(l => Number(l.qty) > (stockByItem[l.itemId] || 0));
  const canSubmitIndividual = person.trim() && role && validLines.length > 0 && !overStockIndividual;

  const validRows = rows.filter(r => r.person.trim() && r.role && r.itemId && Number(r.qty) > 0);
  const overStockCollective = validRows.some(r => Number(r.qty) > (stockByItem[r.itemId] || 0));
  const canSubmitCollective = validRows.length > 0 && !overStockCollective;

  function submitIndividual() {
    const finalLines = validLines.map(l => ({
      person: person.trim(), matricule: matricule.trim(), role, itemId: l.itemId, qty: Number(l.qty)
    }));
    const { batchId, refNo } = onSubmit(finalLines, note, deliveryDate);
    setLastSlip({
      batchId, refNo, note, date: deliveryDate,
      lines: finalLines.map(l => ({ ...items.find(i => i.id === l.itemId), qty: l.qty, person: l.person, matricule: l.matricule, role: l.role }))
    });
    setPerson(''); setMatricule(''); setNote(''); setLines([{ itemId: '', qty: '' }]);
  }

  function submitCollective() {
    const finalLines = validRows.map(r => ({
      person: r.person.trim(), matricule: r.matricule.trim(), role: r.role, itemId: r.itemId, qty: Number(r.qty)
    }));
    const { batchId, refNo } = onSubmit(finalLines, note, deliveryDate);
    setLastSlip({
      batchId, refNo, note, date: deliveryDate,
      lines: finalLines.map(l => ({ ...items.find(i => i.id === l.itemId), qty: l.qty, person: l.person, matricule: l.matricule, role: l.role }))
    });
    setNote(''); setRows([emptyRow()]);
  }

  if (items.length === 0) {
    return <EmptyState icon={Package} text={t(lang, 'emptyDeliverNoItems')} />;

  return (

            <button className="tab-btn px-3 py-1.5 rounded-lg text-xs font-bold" data-active={mode === 'collective'} onClick={() => setMode('collective')}>{t(lang, 'modeCollective')}</button>

            {directory.length > 0 && (

/* ---------------- People Tab ---------------- */
function categorizeForPerson(p, items) {
  return CATEGORIES.map(cat => {
    const totals = {};
    p.batches.forEach(b => b.lines.forEach(l => {
      const it = items.find(i => i.id === l.itemId);
      if ((it?.category || CATEGORIES[0]) === cat) {
        totals[l.itemId] = (totals[l.itemId] || 0) + l.qty;
      }
    }));
    return {
      cat,
      list: Object.entries(totals).map(([itemId, qty]) => ({ itemId, qty, name: items.find(i => i.id === itemId)?.name || '—' }))
    };
  }).filter(g => g.list.length > 0);
}

function PersonStatement({ person, categorized, refLabel, onClose, profile }) {
  const total = categorized.reduce((s, g) => s + g.list.reduce((s2, l) => s2 + l.qty, 0), 0);
  let counter = 0;
  return (

function PeopleTab({ byPerson, items, onIssueStatement, profile, lang }) {
  const [openPerson, setOpenPerson] = useState(null);
  const [printTarget, setPrintTarget] = useState(null);
  const [printRef, setPrintRef] = useState(null);
  const [query, setQuery] = useState('');
  const [catFilter, setCatFilter] = useState('all');

  if (byPerson.length === 0) {
    return <EmptyState icon={Users} text={t(lang, 'emptyPeople')} />;
  }

  const printPerson = printTarget ? byPerson.find(p => p.person === printTarget) : null;

  function openStatement(p) {
    const key = p.matricule || p.person;
    const count = onIssueStatement(key);
    setPrintRef(`${p.matricule || p.person}-${count}`);
    setPrintTarget(p.person);
  }

  const q = query.trim();
  const visiblePeople = byPerson
    .map(p => {
      const allCategorized = categorizeForPerson(p, items);
      const categorized = catFilter === 'all' ? allCategorized : allCategorized.filter(g => g.cat === catFilter);
      return { p, categorized };
    })
    .filter(({ p, categorized }) => {
      if (catFilter !== 'all' && categorized.length === 0) return false;
      if (q && !p.person.includes(q) && !(p.matricule || '').includes(q)) return false;
      return true;
    });
  const peoplePagination = usePagination(visiblePeople, 10);

  return (
    <div>
      {printPerson && (
        <PersonStatement
          person={printPerson}
          categorized={categorizeForPerson(printPerson, items)}
          refLabel={printRef}
          onClose={() => setPrintTarget(null)}
          profile={profile}
        />
      )}

      <div className="relative mb-3">
        <Search size={16} className="absolute top-1/2 -translate-y-1/2 right-3" style={{ color: 'var(--ink-soft)' }} />
        <input
          className="w-full pr-9 pl-3 py-2.5 rounded-lg text-sm"
          placeholder={t(lang, 'searchPerson')}
          value={query}
          onChange={e => setQuery(e.target.value)}
        />
      </div>

      <CategoryFilterDropdown value={catFilter} onChange={setCatFilter} lang={lang} />

      {visiblePeople.length === 0 ? (
        <EmptyState icon={Search} text={t(lang, 'emptyResults')} />
      ) : (
        <div className="flex flex-col gap-3">
          {peoplePagination.pageItems.map(({ p, categorized }) => {
            const totalItems = categorized.reduce((s, g) => s + g.list.reduce((s2, l) => s2 + l.qty, 0), 0);
            const isOpen = openPerson === p.person;
            return (
              <div key={p.person} className="reg-card rounded-xl overflow-hidden">
                <div className="w-full flex items-center justify-between p-4">
                  <button className="flex items-center gap-3 flex-1 text-left" onClick={() => setOpenPerson(isOpen ? null : p.person)}>
                    <div className="flex items-center justify-center rounded-full shrink-0" style={{ width: 38, height: 38, background: 'var(--paper-dark)' }}>
                      <User size={17} />
                    </div>
                    <div className="text-left">
                      <div className="reg-display font-bold text-sm">{p.person}</div>
                      <div className="text-xs" style={{ color: 'var(--ink-soft)' }}>{p.role}{p.matricule ? ` · ${p.matricule}` : ''} · {p.batches.length} livraison(s)</div>
                    </div>
                  </button>
                  <div className="flex items-center gap-3 shrink-0">
                    <div className="text-center">
                      <div className="tabular reg-display font-black">{totalItems}</div>
                      <div className="text-[10px]" style={{ color: 'var(--ink-soft)' }}>article(s) livré(s)</div>
                    </div>
                    <button
                      className="p-1.5 rounded-lg opacity-60 hover:opacity-100"
                      style={{ background: 'var(--paper-dark)' }}
                      onClick={() => openStatement(p)}
                      aria-label="Imprimer l'état du bénéficiaire"
                    >
                      <Printer size={15} />
                    </button>
                    <button onClick={() => setOpenPerson(isOpen ? null : p.person)} aria-label="Ouvrir/Fermer">
                      <ChevronDown size={18} style={{ transform: isOpen ? 'rotate(180deg)' : 'none', transition: 'transform 0.15s' }} />
                    </button>
                  </div>
                </div>
                {isOpen && (
                  <div className="px-4 pb-4 flex flex-col gap-3 border-t pt-3" style={{ borderColor: 'var(--line)' }}>
                    {categorized.map(g => {
                      let counter = 0;
                      return (
                        <div key={g.cat}>
                          <div
                            className="reg-display text-xs font-bold mb-1.5 inline-block px-1.5 py-0.5 rounded"
                            style={{ color: categoryColor(g.cat), background: 'var(--paper-dark)' }}
                          >
                            {g.cat}
                          </div>
                          <div className="reg-card rounded-lg overflow-hidden">
                            <div className="overflow-x-auto">
                            <table className="w-full text-sm border-collapse">
                              <thead>
                                <tr style={{ background: 'var(--paper-dark)' }}>
                                  <th className="text-center reg-display text-xs font-bold py-1.5" style={{ width: 28 }}>N°</th>
                                  <th className="text-left reg-display text-xs font-bold py-1.5 px-2">Article</th>
                                  <th className="text-center reg-display text-xs font-bold py-1.5" style={{ width: 55 }}>Quantité</th>
                                </tr>
                              </thead>
                              <tbody>
                                {g.list.map(l => {
                                  counter += 1;
                                  return (
                                    <tr key={l.itemId} style={{ borderTop: '1px dashed var(--line)' }}>
                                      <td className="text-center tabular py-1.5">{counter}</td>
                                      <td className="py-1.5 px-2">{l.name}</td>
                                      <td className="text-center tabular font-bold py-1.5">{l.qty}</td>
                                    </tr>

            );
          })}

      )}
      <Pagination page={peoplePagination.page} totalPages={peoplePagination.totalPages} onChange={peoplePagination.setPage} />
    </div>
  );
}

/* ---------------- Log Tab ---------------- */
function LogTab({ movements, items, pvLog, stockByItem, lang }) {
  const [filterType, setFilterType] = useState('all');
  const [catFilter, setCatFilter] = useState('all');
  const [query, setQuery] = useState('');
  const [tablePages, setTablePages] = useState({});
  const itemName = id => items.find(i => i.id === id)?.name || '—';
  const itemUnit = id => items.find(i => i.id === id)?.unit || '';
  const itemCategory = id => items.find(i => i.id === id)?.category || null;

  if (movements.length === 0) {
    return <EmptyState icon={ScrollText} text={t(lang, 'emptyLog')} />;
  }

  const sorted = [...movements].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  const typeFiltered = filterType === 'all' ? sorted : sorted.filter(m => m.type === filterType);
  const q = query.trim();
  const filtered = !q ? typeFiltered : typeFiltered.filter(m => {
    const name = itemName(m.itemId);
    const who = m.type === 'out' ? m.person : (m.source || '');
    return name.includes(q) || who.includes(q);
  });

  const catList = catFilter === 'all' ? CATEGORIES : [catFilter];
  const grouped = catList
    .map(cat => ({
      cat,
      list: filtered.filter(m => itemCategory(m.itemId) === cat),
      balance: items.filter(it => (it.category || CATEGORIES[0]) === cat)
    }))
    .filter(g => g.list.length > 0 || g.balance.length > 0);
  if (catFilter === 'all') {
    const uncategorizedMoves = filtered.filter(m => !CATEGORIES.includes(itemCategory(m.itemId)));
    const uncategorizedItems = items.filter(it => !CATEGORIES.includes(it.category));
    if (uncategorizedMoves.length > 0 || uncategorizedItems.length > 0) {
      grouped.push({ cat: 'Autres', list: uncategorizedMoves, balance: uncategorizedItems });
    }
  }

  function renderBalance(itemList) {
    if (itemList.length === 0) return null;
    return (
      <div className="reg-card rounded-xl overflow-hidden mb-2">
        <div className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead>
            <tr className="text-left border-b" style={{ borderColor: 'var(--line)', background: 'var(--paper-dark)' }}>
              <th className="p-2.5 reg-display font-bold text-xs">Article</th>
              <th className="p-2.5 reg-display font-bold text-xs" style={{ width: 110 }}>Stock restant</th>
            </tr>
          </thead>
          <tbody>
            {itemList.map(it => (
              <tr key={it.id} className="border-b last:border-0" style={{ borderColor: 'var(--line)' }}>
                <td className="p-2.5">{it.name}</td>
                <td className="p-2.5 tabular font-bold">{stockByItem[it.id] || 0} {it.unit}</td>
              </tr>
            ))}
          </tbody>
        </table>
        </div>
      </div>
    );
  }

  function renderTable(rows, cat) {
    if (rows.length === 0) return null;
    const pageSize = 10;
    const page = Math.min(tablePages[cat] || 0, Math.max(0, Math.ceil(rows.length / pageSize) - 1));
    const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
    const pageRows = rows.slice(page * pageSize, page * pageSize + pageSize);
    const setPage = p => setTablePages(prev => ({ ...prev, [cat]: p }));
    return (
      <div className="reg-card rounded-xl overflow-hidden">
        <div className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead>
            <tr className="text-left border-b" style={{ borderColor: 'var(--line)', background: 'var(--paper-dark)' }}>
              <th className="p-3 reg-display font-bold text-xs">{t(lang, 'colDate')}</th>
              <th className="p-3 reg-display font-bold text-xs">{t(lang, 'colType')}</th>
              <th className="p-3 reg-display font-bold text-xs">{t(lang, 'colInvoiceNo')}</th>
              <th className="p-3 reg-display font-bold text-xs">{t(lang, 'colItem')}</th>
              <th className="p-3 reg-display font-bold text-xs">{t(lang, 'colQty')}</th>
              <th className="p-3 reg-display font-bold text-xs">{t(lang, 'colPartner')}</th>
              <th className="p-3 reg-display font-bold text-xs">{t(lang, 'colNote')}</th>
            </tr>
          </thead>
          <tbody>
            {pageRows.map(m => (
              <tr key={m.id} className="border-b last:border-0" style={{ borderColor: 'var(--line)' }}>
                <td className="p-3 tabular text-xs whitespace-nowrap">{fmtDate(m.date)}</td>
                <td className="p-3">
                  <span
                    className="text-[11px] font-bold px-2 py-0.5 rounded-full inline-flex items-center gap-1"
                    style={{ background: m.type === 'in' ? 'rgba(31,92,77,0.12)' : 'rgba(161,61,44,0.12)', color: m.type === 'in' ? 'var(--forest)' : 'var(--rust)' }}
                  >
                    {m.type === 'in' ? <ArrowDownToLine size={11} /> : <ArrowUpFromLine size={11} />}
                    {m.type === 'in' ? t(lang, 'typeIn') : t(lang, 'typeOut')}
                  </span>
                </td>
                <td className="p-3 tabular text-xs">{m.type === 'out' ? (m.refNo || '—') : (m.invoiceNo || '—')}</td>
                <td className="p-3">{itemName(m.itemId)}</td>
                <td className="p-3 tabular font-bold">{m.qty} {itemUnit(m.itemId)}</td>
                <td className="p-3 text-xs">{m.type === 'out' ? `${m.person} (${m.role})` : (m.source || '—')}</td>
                <td className="p-3 text-xs" style={{ color: 'var(--ink-soft)' }}>{m.note || '—'}</td>
              </tr>
            ))}
          </tbody>
        </table>
        </div>
        <div className="p-2">
          <Pagination page={page} totalPages={totalPages} onChange={setPage} />
        </div>
      </div>
    );
  }

  return (
    <div>
      <div className="relative mb-3">
        <Search size={16} className="absolute top-1/2 -translate-y-1/2 right-3" style={{ color: 'var(--ink-soft)' }} />
        <input
          className="w-full pr-9 pl-3 py-2.5 rounded-lg text-sm"
          placeholder={t(lang, 'searchLog')}
          value={query}
          onChange={e => setQuery(e.target.value)}
        />
      </div>

      <div className="flex gap-2 mb-2">
        {[['all', t(lang, 'logAll')], ['in', t(lang, 'logIn')], ['out', t(lang, 'logOut')]].map(([val, label]) => (
          <button
            key={val}
            className="tab-btn px-3 py-1.5 rounded-lg text-xs font-bold"
            data-active={filterType === val}
            onClick={() => setFilterType(val)}
          >
            {label}
          </button>
        ))}
      </div>

      <CategoryFilterDropdown value={catFilter} onChange={setCatFilter} lang={lang} />

      {grouped.length === 0 ? (
        <EmptyState icon={Search} text={t(lang, 'emptyResults')} />
      ) : (
        <div className="flex flex-col gap-5 mb-5">
          {grouped.map(g => (
            <div key={g.cat}>
              <div
                className="reg-display text-xs font-bold px-2 py-1 rounded mb-1.5 inline-block"
                style={{ color: categoryColor(g.cat), background: 'var(--paper-dark)' }}
              >
                {g.cat}
              </div>
              {renderBalance(g.balance)}
              {renderTable(g.list, g.cat)}
            </div>
          ))}
        </div>
      )}

      {pvLog && pvLog.length > 0 && (
        <div>
          <h3 className="reg-display font-bold text-sm mb-2 flex items-center gap-1.5"><ClipboardList size={15} /> Inventaire du stock restant (PV mensuels)</h3>
          <div className="reg-card rounded-xl overflow-hidden">
            <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="text-left border-b" style={{ borderColor: 'var(--line)', background: 'var(--paper-dark)' }}>
                  <th className="p-3 reg-display font-bold text-xs">Type</th>
                  <th className="p-3 reg-display font-bold text-xs">N° PV</th>
                  <th className="p-3 reg-display font-bold text-xs">Date d'émission</th>
                </tr>
              </thead>
              <tbody>
                {[...pvLog].reverse().map((p, i) => (
                  <tr key={i} className="border-b last:border-0" style={{ borderColor: 'var(--line)' }}>
                    <td className="p-3">
                      <span
                        className="text-[11px] font-bold px-2 py-0.5 rounded-full inline-flex items-center gap-1"
                        style={{ background: 'rgba(166,124,61,0.16)', color: 'var(--brass)' }}
                      >
                        <ClipboardList size={11} /> Inventaire
                      </span>
                    </td>
                    <td className="p-3 font-bold">{p.ref}</td>
                    <td className="p-3 tabular text-xs">{fmtDate(p.date)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------- PV (Inventory Report) Tab ---------------- */
function PVTab({ items, stockByItem, pvLog, onIssue, profile, lang }) {
  const date = todayISO();
  const ref = monthRef(date);
  const key = monthKey(date);
  const alreadyIssued = pvLog.some(p => p.ref === ref);

  if (items.length === 0) {
    return <EmptyState icon={ClipboardList} text={t(lang, 'emptyPV')} />;
  }

  const grouped = CATEGORIES
    .map(cat => ({ cat, list: items.filter(it => (it.category || CATEGORIES[0]) === cat) }))
    .filter(g => g.list.length > 0);
  const uncategorized = items.filter(it => !CATEGORIES.includes(it.category));
  if (uncategorized.length > 0) grouped.push({ cat: 'Autres', list: uncategorized });

  let counter = 0;

  return (
    <div className="max-w-2xl mx-auto">
      <div className="reg-card ticket rounded-xl p-6 print-area" style={{ borderStyle: 'dashed' }}>
        <LetterHead refLabel={ref} title="Procès-verbal mensuel d'inventaire du stock" profile={profile} />
        <div className="text-sm mb-4 tabular text-center"><span style={{ color: 'var(--ink-soft)' }}>Fait à {(profile && profile.commune) || ''}, le: </span>{fmtDate(date)}</div>

        {grouped.map(g => (
          <div key={g.cat} className="mb-4">
            <div
              className="reg-display text-xs font-bold px-2 py-1 rounded mb-1.5 inline-block"
              style={{ color: categoryColor(g.cat), background: 'var(--paper-dark)' }}
            >
              {g.cat}
            </div>
            <div className="overflow-x-auto">
            <table className="w-full text-sm border-collapse">
              <thead>
                <tr style={{ borderBottom: '1.5px solid var(--ink)' }}>
                  <th className="text-center reg-display text-xs font-bold py-1.5" style={{ width: 28 }}>N°</th>
                  <th className="text-left reg-display text-xs font-bold py-1.5">Article</th>
                  <th className="text-center reg-display text-xs font-bold py-1.5" style={{ width: 55 }}>Unité</th>
                  <th className="text-center reg-display text-xs font-bold py-1.5" style={{ width: 55 }}>Quantité</th>
                </tr>
              </thead>
              <tbody>
                {g.list.map(it => {
                  counter += 1;
                  return (
                    <tr key={it.id} style={{ borderBottom: '1px dashed var(--line)' }}>
                      <td className="text-center tabular py-1.5">{counter}</td>
                      <td className="py-1.5">{it.name}</td>
                      <td className="text-center py-1.5">{it.unit}</td>
                      <td className="text-center tabular font-bold py-1.5">{stockByItem[it.id] || 0}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            </div>
          </div>
        ))}

        <div className="perf-edge -mx-6 mt-2 mb-3" />
        <div className="grid grid-cols-2 gap-3 mt-4">
          <div className="text-center">
            <div className="text-[11px] font-bold mb-6">Cachet et signature du Chef des services matériels et financiers</div>
            <div style={{ borderTop: '1px dashed var(--line)' }} />
          </div>
          <div className="text-center">
            <div className="text-[11px] font-bold mb-6">Cachet et signature du Chef d'établissement</div>
            <div style={{ borderTop: '1px dashed var(--line)' }} />
          </div>
        </div>
      </div>
      <button
        className="w-full mt-2 py-2 rounded-lg text-xs font-bold flex items-center justify-center gap-1.5 no-print"
        style={{ background: 'var(--paper-dark)' }}
        onClick={() => { onIssue(ref, date); window.print(); }}
      >
        <Printer size={14} /> Imprimer le PV
      </button>
      {alreadyIssued && (
        <p className="text-xs text-center mt-2 no-print" style={{ color: 'var(--ink-soft)' }}>
          Le PV du mois de {ref} est déjà enregistré dans le registre général (n° {ref})
        </p>
      )}
    </div>
  );
}

function LockScreen({ lang, auth, onUnlock }) {
  const [user, setUser] = useState('');
  const [pass, setPass] = useState('');
  const [error, setError] = useState(false);
  const dir = lang === 'ar' ? 'rtl' : 'ltr';

  function attempt() {
    if (user === auth.username && pass === auth.password) {
      onUnlock();
    } else {
      setError(true);
    }
  }

  return (
    <div className="reg-root" dir={dir} style={{ minHeight: '100vh' }}>
      <style>{FONT_STYLES}</style>
      <div className="flex items-center justify-center" style={{ minHeight: '100vh' }}>
        <div className="reg-card rounded-xl p-6 w-full max-w-sm mx-4">
          <div className="flex flex-col items-center text-center mb-4">
            <Lock size={28} style={{ color: 'var(--ink-soft)' }} />
            <h1 className="reg-display font-black text-lg mt-2">{t(lang, 'unlockTitle')}</h1>
          </div>
          <div className="flex flex-col gap-3">
            <input
              className="w-full px-3 py-2 rounded-lg text-sm"
              placeholder={t(lang, 'lockUsername')}
              value={user} onChange={e => { setUser(e.target.value); setError(false); }}
            />
            <input
              className="w-full px-3 py-2 rounded-lg text-sm"
              type="password"
              placeholder={t(lang, 'lockPassword')}
              value={pass} onChange={e => { setPass(e.target.value); setError(false); }}
              onKeyDown={e => e.key === 'Enter' && attempt()}
            />
            {error && <p className="text-xs font-bold" style={{ color: 'var(--rust)' }}>{t(lang, 'unlockError')}</p>}
            <button className="btn-primary w-full py-2.5 rounded-lg text-sm font-bold" onClick={attempt}>
              {t(lang, 'unlockButton')}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

  const [editName, setEditName] = useState(active?.name || '');
  const [editRegion, setEditRegion] = useState(active?.region || REGIONS_MA[0]);

    onCreateNew({ name: newName.trim(), region: newRegion, directorate: newDirectorate.trim(), commune: newCommune.trim() });
