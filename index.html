function App() {
  const [loaded, setLoaded] = useState(false);
  const [institutions, setInstitutions] = useState([]);
  const [activeId, setActiveId] = useState(null);
  const [lang, setLang] = useState('fr');
  const [auth, setAuth] = useState(null);
  const [unlocked, setUnlocked] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const [instRes, langRes, authRes] = await Promise.all([
          window.storage.get(INSTITUTIONS_KEY, false).catch(() => null),
          window.storage.get(LANG_KEY, false).catch(() => null),
          window.storage.get(AUTH_KEY, false).catch(() => null)
        ]);
        if (instRes && instRes.value) {
          const data = JSON.parse(instRes.value);
          setInstitutions(data.list || []);
          setActiveId(data.activeId || (data.list[0] && data.list[0].id) || null);
        }
        if (langRes && langRes.value) setLang(langRes.value);
        if (authRes && authRes.value) setAuth(JSON.parse(authRes.value));
      } catch (e) {
        // first run
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    window.storage.set(INSTITUTIONS_KEY, JSON.stringify({ list: institutions, activeId }), false).catch(() => {});
  }, [institutions, activeId, loaded]);

  useEffect(() => {
    if (!loaded) return;
    window.storage.set(LANG_KEY, lang, false).catch(() => {});
  }, [lang, loaded]);

  useEffect(() => {
    if (!loaded) return;
    if (auth) window.storage.set(AUTH_KEY, JSON.stringify(auth), false).catch(() => {});
    else window.storage.delete(AUTH_KEY, false).catch(() => {});
  }, [auth, loaded]);

  function createInstitution(profile) {
    const id = uid();
    setInstitutions(prev => [...prev, { id, ...profile }]);
    setActiveId(id);
  }

  function updateInstitution(id, patch) {
    setInstitutions(prev => prev.map(i => (i.id === id ? { ...i, ...patch } : i)));
  }

  function deleteInstitution(id) {
    setInstitutions(prev => {
      const next = prev.filter(i => i.id !== id);
      if (activeId === id) setActiveId(next[0] ? next[0].id : null);
      return next;
    });
  }

  if (!loaded) {
    return (
      <div className="reg-root flex items-center justify-center" style={{ height: '100vh' }}>
        <style>{FONT_STYLES}</style>
        <div className="reg-display text-lg" style={{ color: 'var(--ink-soft)' }}>Chargement...</div>
      </div>
    );
  }

  if (auth && !unlocked) {
    return <LockScreen lang={lang} auth={auth} onUnlock={() => setUnlocked(true)} />;
  }

  if (institutions.length === 0) {
    return <FirstRunSetup lang={lang} onCreate={createInstitution} onSetLang={setLang} />;
  }

  const active = institutions.find(i => i.id === activeId) || institutions[0];
  const storageKey = `${STORAGE_KEY}-${active.id}`;
  const dirKey = `${DIR_KEY}-${active.id}`;

  return (
    <>
      <InventoryRegister storageKey={storageKey} dirKey={dirKey} profile={active} onOpenMenu={() => setMenuOpen(true)} lang={lang} />
      {menuOpen && (
        <MenuPanel
          lang={lang}
          onSetLang={setLang}
          institutions={institutions}
          activeId={active.id}
          onSwitch={id => { setActiveId(id); setMenuOpen(false); }}
          onCreateNew={createInstitution}
          onUpdate={updateInstitution}
          onDelete={deleteInstitution}
          auth={auth}
          onSetAuth={setAuth}
          onClose={() => setMenuOpen(false)}
        />
      )}
    </>
  );
}

function usePagination(items, pageSize) {
  const [page, setPage] = useState(0);
  const totalPages = Math.max(1, Math.ceil(items.length / pageSize));
  const clampedPage = Math.min(page, totalPages - 1);
  const pageItems = items.slice(clampedPage * pageSize, clampedPage * pageSize + pageSize);
  return { page: clampedPage, setPage, totalPages, pageItems };
}

function CategoryFilterDropdown({ value, onChange, lang }) {
  const [open, setOpen] = useState(false);
  const label = value === 'all' ? t(lang, 'allCategories') : value;
  return (
    <div className="relative mb-5">
      <button
        className="reg-card flex items-center justify-between gap-2 px-4 py-2.5 rounded-lg text-xs font-bold w-full sm:w-auto sm:min-w-[220px]"
        onClick={() => setOpen(v => !v)}
      >
        <span style={{ color: value !== 'all' ? categoryColor(value) : 'var(--ink)' }}>{label}</span>
        <ChevronDown size={14} style={{ transform: open ? 'rotate(180deg)' : 'none', transition: 'transform 0.15s' }} />
      </button>
      {open && (
        <>
          <div className="fixed inset-0 z-10" onClick={() => setOpen(false)} />
          <div className="reg-card rounded-lg mt-1 absolute z-20 w-full sm:w-[220px] overflow-hidden">
            <button
              className="flex items-center w-full text-xs py-2.5 px-4"
              style={{ background: value === 'all' ? 'var(--paper-dark)' : 'transparent', fontWeight: value === 'all' ? 'bold' : 'normal' }}
              onClick={() => { onChange('all'); setOpen(false); }}
            >
              {t(lang, 'allCategories')}
            </button>
            {CATEGORIES.map(c => (
              <button
                key={c}
                className="flex items-center w-full text-xs py-2.5 px-4"
                style={{ background: value === c ? 'var(--paper-dark)' : 'transparent', color: value === c ? categoryColor(c) : 'var(--ink)', fontWeight: value === c ? 'bold' : 'normal' }}
                onClick={() => { onChange(c); setOpen(false); }}
              >
                {c}
              </button>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

function Pagination({ page, totalPages, onChange }) {
  if (totalPages <= 1) return null;
  return (
    <div className="flex items-center justify-center gap-3 mt-4">
      <button
        className="w-9 h-9 flex items-center justify-center rounded-lg disabled:opacity-30 text-sm font-bold"
        style={{ background: 'var(--paper-dark)' }}
        onClick={() => onChange(page - 1)}
        disabled={page === 0}
        aria-label="Page précédente"
      >
        ‹
      </button>
      <span className="text-xs font-bold tabular" style={{ color: 'var(--ink-soft)' }}>{page + 1} / {totalPages}</span>
      <button
        className="w-9 h-9 flex items-center justify-center rounded-lg disabled:opacity-30 text-sm font-bold"
        style={{ background: 'var(--paper-dark)' }}
        onClick={() => onChange(page + 1)}
        disabled={page >= totalPages - 1}
        aria-label="Page suivante"
      >
        ›
      </button>
    </div>
  );
}

function EmptyState({ icon: Icon, text }) {
  return (
    <div className="reg-card rounded-xl p-10 flex flex-col items-center text-center gap-3">
      <Icon size={28} style={{ color: 'var(--ink-soft)' }} />
      <p className="text-sm max-w-xs" style={{ color: 'var(--ink-soft)' }}>{text}</p>
    </div>
  );
}

const root = createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><App /></ErrorBoundary>);

// Enregistrement du service worker : ne fonctionne que si le fichier est servi
// via http(s) (hébergement réel), pas en ouverture directe file://.
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
